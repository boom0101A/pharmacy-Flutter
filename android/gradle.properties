# خُفّض من 4G إلى 2G — الجهاز 8GB إجمالاً، وطلب 4G لـJVM يستنزف pagefile
# فيفشل native compile بـ"The paging file is too small". 2G يكفي Gradle
# ويترك مساحة لـcmake/clang/ninja.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# منع عمّال متوازين متعددين — كلٌّ منهم JVM إضافي يلتهم الذاكرة
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental caches fail to close on this drive — disable IC
kotlin.incremental=false
